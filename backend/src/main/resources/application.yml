spring:
  application:
    name: obec-portal
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  
  # R2DBC PostgreSQL Configuration
  r2dbc:
    url: "r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:obec_portal}"
    username: "${POSTGRES_USER:portal}"
    password: "${POSTGRES_PASSWORD:portal}"
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: "SELECT 1"
  
  # Liquibase for migrations
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
    parameters:
      postgres:
        schema: public
  
  # Keycloak / OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/obec}"
      client:
        registration:
          keycloak:
            client-id: "${KEYCLOAK_CLIENT_ID:obec-portal}"
            client-secret: "${KEYCLOAK_CLIENT_SECRET:}"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,roles
        provider:
          keycloak:
            issuer-uri: "${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/obec}"
            user-name-attribute: preferred_username

server:
  port: 8080
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  level:
    cz.obec.portal: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

# Custom properties
keycloak:
  issuer-uri: "${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/obec}"
  admin-url: "${KEYCLOAK_ADMIN_URL:http://keycloak:8080/admin}"
  realm: obec

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8080}"
  pdf:
    font-path: "classpath:fonts/DejaVuSans.ttf"
  verification:
    base-url: "${VERIFICATION_BASE_URL:https://obec.cz/overeni}"