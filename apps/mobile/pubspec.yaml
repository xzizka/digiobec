name: municipal_portal
description: Municipal Citizen Portal - Flutter mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Navigation
  go_router: ^14.0.0
  # State management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  # Networking
  dio: ^5.5.0
  # Local database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  # Secure storage
  flutter_secure_storage: ^9.2.0
  # UI
  material_design_icons_flutter: ^7.0.7291
  # Map (Czech POINT locator)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # JSON serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  # PDF
  printing: ^5.12.0
  pdf: ^3.10.0
  # Localization
  easy_localization: ^3.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/translations/