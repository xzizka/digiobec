databaseChangeLog:
  - changeSet:
      id: v1.1.0__submission_tracking_code
      author: portal-team
      changes:
        - renameColumn:
            tableName: submission
            oldColumnName: reference_number
            newColumnName: tracking_code
            columnDataType: varchar(50)

        - renameColumn:
            tableName: submission
            oldColumnName: form_id
            newColumnName: form_key
            columnDataType: varchar(100)

        - addColumn:
            tableName: submission
            columns:
              - column:
                  name: client_ip
                  type: varchar(45)

        - createIndex:
            tableName: submission
            indexName: idx_submission_tracking_code
            unique: true
            columns:
              - column:
                  name: tracking_code

        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_submission_form_data_gin ON submission USING GIN (form_data jsonb_path_ops);
