spring:
  application:
    name: portal-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DATABASE_USER:portal}
    password: ${DATABASE_PASSWORD:portal}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:dev}
  doc:
    api-docs:
      path: /api/v3/api-docs
  actuator:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus
    health:
      db:
        enabled: true
      keycloak:
        enabled: true

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    cz.obec.portal: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# External registries — mock values keep the demo working without keys;
# point at real endpoints via env vars in production.
portal:
  base-url: ${PORTAL_BASE_URL:https://obec.cz}

ruian:
  api-url: ${RUIAN_API_URL:https://api.ruian.cz}
  api-key: ${RUIAN_API_KEY:mock-key}

czech-point:
  api-url: ${CZECH_POINT_API_URL:https://czechpoint.gov.cz/api}
  api-key: ${CZECH_POINT_API_KEY:mock-key}

isvs:
  api-url: ${ISVS_API_URL:}

osrm:
  api-url: ${OSRM_API_URL:https://router.project-osrm.org}