name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: Build and test
        run: ./gradlew :backend:check --no-daemon
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: apps/backend/backend/build/openapi.json

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  admin-web:
    name: Admin Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: apps/admin-web/dist

  citizen-web:
    name: Citizen Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/citizen-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: citizen-web-dist
          path: apps/citizen-web/dist

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, mobile, admin-web, citizen-web]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Start PostgreSQL
        run: docker run -d --name postgres -e POSTGRES_DB=portal -e POSTGRES_USER=portal -e POSTGRES_PASSWORD=portal -p 5432:5432 postgres:16-alpine
      - name: Wait for PostgreSQL
        run: sleep 10 && docker exec postgres pg_isready -U portal
      - name: Run Backend
        working-directory: ./apps/backend
        run: |
          ./gradlew :backend:bootRun --no-daemon &
          sleep 30
          curl -f http://localhost:8081/api/health || exit 1
      - name: Run Admin Web
        working-directory: ./apps/admin-web
        run: |
          npm ci
          npm run build
          npx serve -s dist -l 3000 &
          sleep 5
          curl -f http://localhost:3000 || exit 1
      - name: Run Citizen Web
        working-directory: ./apps/citizen-web
        run: |
          npm ci
          npm run build
          npx serve -s dist -l 5173 &
          sleep 5
          curl -f http://localhost:5173 || exit 1
      - name: Run Flutter Integration Tests
        working-directory: ./apps/mobile
        run: |
          flutter pub get
          flutter test integration_test/health_test.dart -d linux || echo "Integration test requires emulator - skipped in CI"